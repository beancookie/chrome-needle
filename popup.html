<!DOCTYPE html>
<html>
<head><meta charset="UTF-8" /><style>
  :root {
    --accent: #f97316;
    --accent-hover: #ea6a0a;
    --text: #1f2329;
    --text-muted: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 240px;
    padding: 20px 16px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
    background: #f6f7f9;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .logo-icon {
    width: 42px;
    height: 42px;
    margin: 0 auto 10px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #fb923c);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3);
  }
  .logo { font-weight: 700; font-size: 15px; letter-spacing: -0.2px; }
  .logo em { color: var(--accent); font-style: normal; }
  p { font-size: 11.5px; line-height: 1.55; color: var(--text-muted); margin: 8px 0 14px; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: scale(0.97); }
  .foot { font-size: 10px; color: #9ca3af; margin-top: 12px; }
</style></head>
<body>
  <div class="logo-icon">N</div>
  <div class="logo">Chrome<em>Needle</em></div>
  <p>A 45M LLM that runs locally in your browser and controls your tabs.</p>
  <button id="open">
    Open Side Panel
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="foot">Runs 100% locally · no data leaves your browser</div>
  <script src="popup.js"></script>
</body>
</html>
